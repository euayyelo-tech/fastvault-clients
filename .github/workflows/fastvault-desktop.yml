name: FastVault desktop (Windows)
on:
  push:
    branches: [fastvault]
    tags: ["fastvault-desktop-v*"]
  workflow_dispatch:
permissions:
  contents: write
# One run per ref at a time, so rapid pushes to `fastvault` (or a re-pushed tag) queue instead of
# running two ~20 minute builds of the same tree in parallel. cancel-in-progress stays false on
# purpose: the run that would be cancelled could be the one uploading a release. Note this groups
# per ref, so the branch push and the tag push of a release are still two runs — the branch one
# just builds and uploads an artifact; only the tag one publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: "**/package-lock.json" }
      # Third-party actions are pinned to a commit SHA, not a mutable tag: this job has
      # `contents: write` and produces the binaries users auto-install, so a retagged v2 would be
      # a straight supply-chain compromise of a password manager's release pipeline. The
      # actions/* steps above are GitHub's own. Re-pin deliberately when updating.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)
        with: { workspaces: "apps/desktop/desktop_native -> target" }
      # The tag must agree with fastvault/version.txt. electron-builder stamps version.txt's value
      # into latest.yml and into the app manifest, so a mismatched tag publishes a release whose
      # auto-update metadata disagrees with its own name and breaks electron-updater.
      - name: Check tag matches fastvault/version.txt
        if: startsWith(github.ref, 'refs/tags/fastvault-desktop-v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#fastvault-desktop-v}"
          file_version="$(tr -d '[:space:]' < fastvault/version.txt)"
          echo "tag=$tag_version version.txt=$file_version"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag_version but fastvault/version.txt says $file_version"
            exit 1
          fi
      - run: rustup show
        working-directory: apps/desktop/desktop_native
      - run: npm ci
      - run: node fastvault/apply.mjs
        env:
          # All six are passed so apply.mjs can assert they are all-or-nothing; electron-builder
          # needs the second trio at packaging time.
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - run: node build.js --release
        working-directory: apps/desktop/desktop_native
      - run: npm run build
        working-directory: apps/desktop
      # Brand check on the thing that actually ships, before the long packaging step.
      - run: node fastvault/verify-build.mjs
      - run: npx electron-builder --win nsis portable --x64 -p never
        working-directory: apps/desktop
        env:
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: fastvault-desktop-windows
          path: |
            apps/desktop/dist/FastVault-*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
      - name: Compose release body
        if: startsWith(github.ref, 'refs/tags/fastvault-desktop-v')
        shell: bash
        run: |
          {
            echo "RELEASE_BODY<<EOF"
            echo "Windows x64. Based on bitwarden/clients $(tr -d '[:space:]' < fastvault/UPSTREAM) (see fastvault/UPSTREAM). Unsigned until code signing is configured."
            echo "EOF"
          } >> "$GITHUB_ENV"
      - if: startsWith(github.ref, 'refs/tags/fastvault-desktop-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (v2.6.2)
        with:
          name: FastVault Desktop ${{ github.ref_name }}
          body: ${{ env.RELEASE_BODY }}
          files: |
            apps/desktop/dist/FastVault-*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
